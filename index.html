<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="css.css">
<link rel="stylesheet" href="sources.css">
<link rel="icon" type="image/png" href="./assets/Logo.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio</title> 
</head>


<body>


    <!-- HEADER -->

    <header>
        <div class="header-bg"></div>

        <div class="header-content">
            <h1 class="title">
                Diccionario de investigación
            </h1>
        </div>
    </header>

    <!-- CONTENEDOR -->

    <main class="container">

        <!-- CONTENIDO -->

        <section class="container-content" id="inicio">

            <div class="card">

                <h2>
                    Conceptos
                </h2>

                <!-- BUSCADOR -->

                <div class="search-container">

                    <input
                        class="search-bar"
                        type="text"
                        placeholder="Buscar..."
                    >

                    <button class="search-button">

                        <div class="search-bar-box"></div>

                    </button>

                </div>

                <div class="gallery">
                </div>

            </div>

        </section>

    </main>

    <br><br><br><br>

    
    <section class="container-content" style="border-radius: 0;" id="referencias">
        <div class="card">
            <h2>Referencias bibliograficas</h2>

            <div id="lista-referencias" class="lista-referencias">
                <p class="referencias-cargando">Cargando referencias...</p>
            </div>
        </div>
    </section>


</body>

<script src="./main.js"></script>

</html>
